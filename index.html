<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Clock</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone-with-data-1970-2030.min.js"></script>
</head>
<body>
    <div class="container">
    <h1>World Clock</h1>

<select name="cities" id="cities">
    <option value="">Select a city...</option>
    <option value="America/New_York">New York 🇺🇸</option>
    <option value="Asia/Tokyo">Tokyo 🇯🇵</option>
    <option value="Europe/Rome">Rome 🇮🇹</option>
    <option value="Europe/London">London 🇬🇧</option>
</select>
<div class="cities">
            <div class="city" id="los-angeles">
          <div>
            <h2>Los Angeles</h2>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>
        <div class="city" id="sydney">
          <div>
            <h2>Sydney</h2>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>
      </div>
</div>
<script src="javascript/index.js"></script>
<footer>Coded by <bold>Serena Di Girolamo</bold>, open sourced on <a href="https://github.com/serenadg/world-clock">GitHub</a> and hosted on 
    <a href="https://sd-world-clock-sd.netlify.app/">Netlify</a></footer>
</body>
</html>
