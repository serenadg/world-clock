<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Clock</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
    <h1>World Clock</h1>

<select name="cities" id="">
    <option value="">Select a city...</option>
    <option value="">Los Angeles 🇺🇸</option>
    <option value="">Sydney 🇦🇺</option>
    <option value="">Rome 🇮🇹</option>
</select>
<div class="cities">
    <div class="city">
        <div><h2>Los Angeles 🇺🇸</h2>
    <div class="date">May 29th 2026</div></div>
    <dic class="time">1:48:15 <small>AM</small></div>
    <div class="city">
        <div><h2>Sydney 🇦🇺</h2>
    <div class="date">May 29th 2026</div></div>
    <dic class="time">1:48:15 <small>AM</small></div>
    </div>
</div>
<script src="javascript/index.js"></script>
<footer>Coded by <bold>Serena Di Girolamo</bold>, open sourced on <a href="https://github.com/serenadg/world-clock">GitHub</a> and hosted on 
    <a href="https://sd-world-clock-sd.netlify.app/">Netlify</a></footer>
</body>
</html>
